rendering:
  depth_output: true
  segmentation_output: true
  camera_type: "PERSP"
  render_engine: CYCLES
  denoise: true
  sampling_render: 32
  resolution_x: 64
  resolution_y: 64
base_mesh:
  meshes: ["tests/resources/mesh_100m_5mpix.tif"]
  material: "moon_albedo"
name: "minimal"
output:
  save_blender_file: false
  output_root: "tests/tmp/datasets/"
terrain:
  desired_spatial_resolution: 1.0
  samples: 2
  rock_field:
    rock_source: 'assets/rocks/generated_100verts'
    h_min: 1.0
    h_max: 10.0
    density:
      type: "uniform"
      min: 0.04
      max: 0.06
  crater_field:
    terrain: "highland"  # polar highlands; "mare" degrades craters more slowly
    surface_age_ga: 3.9  # Gyr
    morphology: "auto"  # from the regolith thickness, or normal, central_mound, flat_bottomed, concentric
    d_min: 2  # m, smallest fresh crater
    # craters larger than resolvable_pixels pixels of the base DEM are already in it
    resolvable_pixels: 10
rendering_cases:
  cases: 3
  distributions:
    sun/elevation:
      type: "uniform"
      min: 0.1
      max: 0.2
    sun/azimuth:
      type: "uniform"
      min: 0.0
      max: 6.28
    camera/z:
      type: "uniform"
      min: 10.0
      max: 20.0