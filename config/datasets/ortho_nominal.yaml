rendering:
  depth_output: false
  segmentation_output: true
  camera_type: "ORTHO"
  render_engine: CYCLES
  denoise: true
  sampling_render: 2048
  resolution_x: 720
  resolution_y: 720
base_mesh:
  meshes: ["../../moon_data/pgda78/Haworth_final_adj_5mpp_surf/pieces_2km/Haworth_final_adj_5mpp_surf_piece_12_*.tif"]
name: "ortho_nominal"
output:
  save_blender_file: true
  output_root: "../../generated_data/datasets/"
terrain:
  desired_spatial_resolution: 1.0
  samples: 3
  add_rocks: true
  add_craters: true
  rock_field:
    rock_source: 'assets/rocks/generated_100verts'
    h_min: 1.4
    h_max: 10.0
    material: "Regolith7_MAT"
    density:
      type: "uniform"
      min: 0.04
      max: 0.06
  crater_field:
    terrain: "highland"  # polar highlands; "mare" degrades craters more slowly
    surface_age_ga:  # Gyr, polar highland surfaces are about 3.5-3.9 Gyr old
      type: "uniform"
      min: 3.5
      max: 3.9
    morphology: "auto"  # from the regolith thickness, or normal, central_mound, flat_bottomed, concentric
    d_min: 2  # m, smallest fresh crater
    # craters larger than resolvable_pixels pixels of the base DEM are already in it
    resolvable_pixels: 10
rendering_cases:
  cases: 30
  distributions:
    sun/elevation:
      type: "uniform"
      min: 0.1
      max: 0.2
    sun/azimuth:
      type: "uniform"
      min: 0.0
      max: 6.28