rendering:
  depth_output: true
  segmentation_output: false
  camera_type: "ORTHO"
  render_engine: CYCLES
  denoise: true
  sampling_render: 2048
  resolution_x: 1024
  resolution_y: 1024
base_mesh:
  meshes: ["data/cut_tif/NPB_final_adj_5mpp_surf_piece_0_0.tif"]
name: "ortho_nominal"
output:
  save_blender_file: true
  output_root: "./generated_data/datasets/"
terrain:
  desired_spatial_resolution: 0.5
  samples: 3
  add_rocks: true
  add_craters: true
  rock_field:
    rock_source: 'assets/rocks/generated_100verts'
    h_min: 2.0
    h_max: 25.0
    material: "Regolith7_MAT"
    density:
      type: "uniform"
      min: 0.01
      max: 0.25
  crater_field:
    crater_type: "normal"
    h_min: 25.0
    h_max: 50.0
    density:
      type: "uniform"
      min: 0.01
      max: 0.1
rendering_cases:
  cases: 30
  distributions:
    sun/elevation:
      type: "uniform"
      min: 0.1
      max: 0.2
    sun/azimuth:
      type: "uniform"
      min: 0.0
      max: 6.28