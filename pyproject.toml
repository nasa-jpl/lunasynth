[project]
name = "lunasynth"
version = "0.8.0"
description = "Generate synthetic lunar images using Blender"
authors = [{ name = "Daniel Pastor", email = "daniel.pastor.moreno@jpl.nasa.gov" }]
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = "==3.11.10"
dependencies = [
    "bpy>=4.1.0,<5",
    "argcomplete>=3.3.0,<4",
    "scipy>=1.13.0,<2",
    "matplotlib>=3.9.0,<4",
    "openexr>=3.2.4,<4",
    "h5py>=3.11.0,<4",
    "opencv-python>=4.9.0.80,<5",
    "ipykernel>=6.29.4,<7",
    "numpy>=1.26.4,<2",
    "opencv-python-headless>=4.9.0.80,<5",
    "trimesh>=4.4.0,<5",
    "pyglet<2",
    "rasterio>=1.3.10,<2",
    "plotly>=5.22.0,<6",
    "bs4>=0.0.2,<0.0.3",
    "pyarrow>=16.1.0,<17",
    "humanize>=4.9.0,<5",
    "tabulate>=0.9.0,<0.10",
    "imageio>=2.34.2,<3",
    "numba>=0.60.0,<0.61",
    "types-pyyaml>=6.0.12.20240917,<7",
    "pandas>=2.2.3,<3",
    "pyyaml>=6.0.2,<7",
    "tqdm>=4.66.5,<5",
]

[project.scripts]
create_rock_field = "lunasynth.cli.create_rock_field:main"
load_rocks = "lunasynth.cli.load_rocks:main"
generate_dataset = "lunasynth.cli.generate_enhanced_moon_terrain_dataset:main"

[dependency-groups]
dev = [
    "ruff>=0.4.8,<0.5",
    "pytest>=8.2.1,<9",
    "pytest-cov>=5.0.0,<6",
    "pytest-mock>=3.14.0,<4",
    "mypy>=1.10.0,<2",
    "pytest-sugar>=1.0.0,<2",
]
docs = [
    "sphinx>=9.0,<9.1",
    "myst-nb>=1.4,<2",
    "myst-parser>=5.1,<5.3",
    "pydata-sphinx-theme>=0.24,<0.25",
    "sphinx-autoapi>=3.9,<4",
    "sphinx-copybutton>=0.5.2,<0.6",
    "sphinx-design>=0.8,<0.9",
    "sphinxcontrib-mermaid>=2.1,<3",
]
playground = [
    "streamlit>=1.38.0,<2",
    "panel>=1.4.3,<2",
    "pyside6>=6.7.0,<7",
]

[tool.uv]
# poetry installed every non-optional group by default; keep that behavior
default-groups = ["dev", "docs", "playground"]

[tool.pytest.ini_options]
addopts = "--verbose --cov=src --cov-report=html"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.coverage.run]
data_file = "tmp/coverage/.coverage"

[tool.coverage.html]
directory = "tmp/coverage/html"

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true

[tool.flake8]
max-line-length = 88
ignore = ["E203", "E266", "E501", "W503"]
exclude = ["__pycache__", "build", "dist", "venv"]

[tool.ruff]
fix = true
line-length = 120
lint.select = [
    "C4",     # flake8-comprehensions
    "E",      # pycodestyle errors
    "EM",     # flake8-errmsg
    "F",      # pyflakes errors
    "I",      # isort
    "ICN",    # flake8-import-conventions
    "LOG",    # flake8-logging
    "PGH",    # pygrep-hooks
    "PYI",    # flake8-pyi
    "RUF100", # unused noqa (yesqa)
    "UP",     # pyupgrade
    "W",      # pycodestyle warnings
    "YTT",    # flake8-2020
]
#    "D",      # pydocstyle

[tool.ruff.lint.isort]
# lunasynth imports are sorted together with third-party packages
known-third-party = ["lunasynth"]
extra-standard-library = ["tomllib"]  # stdlib since 3.11, newer than ruff's default target

[build-system]
requires = ["uv_build>=0.9.18,<0.10"]
build-backend = "uv_build"
